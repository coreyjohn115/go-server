syntax = "proto3";

package due.protocol;
option go_package = "due-server/internal/common/protocol;protocol";

// Field numbers are permanent wire contracts. Append fields; never reuse numbers.

message Player {
  int64 UID = 1 [json_name = "uid"];
  string nickname = 2 [json_name = "nickname"];
  int32 level = 3 [json_name = "level"];
  int64 exp = 4 [json_name = "exp"];
  int64 gold = 5 [json_name = "gold"];
  repeated ItemStack items = 6;
  repeated TaskState tasks = 7;
}

message LoginReq {
  int64 UID = 1 [json_name = "uid"];
  string token = 2 [json_name = "token"];
}

message LoginRes {
  int32 code = 1 [json_name = "code"];
  string message = 2 [json_name = "message"];
  Player player = 3 [json_name = "player"];
  string node = 4 [json_name = "node"];
}

message PingReq {
  string message = 1 [json_name = "message"];
}

message PingRes {
  int32 code = 1 [json_name = "code"];
  string message = 2 [json_name = "message"];
  string server_time = 3 [json_name = "serverTime"];
  string node = 4 [json_name = "node"];
}

message PlayerDataReq {
}

message PlayerDataRes {
  int32 code = 1 [json_name = "code"];
  string message = 2 [json_name = "message"];
  Player player = 3 [json_name = "player"];
  string node = 4 [json_name = "node"];
}

message AddExpReq {
  int64 delta = 1 [json_name = "delta"];
}

message AddExpRes {
  int32 code = 1 [json_name = "code"];
  string message = 2 [json_name = "message"];
  Player player = 3 [json_name = "player"];
  string node = 4 [json_name = "node"];
}

message AddGoldReq {
  int64 delta = 1 [json_name = "delta"];
}

message AddGoldRes {
  int32 code = 1 [json_name = "code"];
  string message = 2 [json_name = "message"];
  Player player = 3 [json_name = "player"];
  string node = 4 [json_name = "node"];
}

message EnterBattleReq {
  string mode = 1 [json_name = "mode"];
}

message EnterBattleRes {
  int32 code = 1 [json_name = "code"];
  string message = 2 [json_name = "message"];
  string RoomID = 3 [json_name = "roomId"];
  int64 UID = 4 [json_name = "uid"];
  string node = 5 [json_name = "node"];
}

message AttackReq {
  string skill = 1 [json_name = "skill"];
}

message AttackRes {
  int32 code = 1 [json_name = "code"];
  string message = 2 [json_name = "message"];
  string RoomID = 3 [json_name = "roomId"];
  int32 hits = 4 [json_name = "hits"];
  string node = 5 [json_name = "node"];
}

message LeaveBattleReq {
}

message LeaveBattleRes {
  int32 code = 1 [json_name = "code"];
  string message = 2 [json_name = "message"];
  string RoomID = 3 [json_name = "roomId"];
  string node = 4 [json_name = "node"];
}

message ErrorRes {
  int32 code = 1 [json_name = "code"];
  string message = 2 [json_name = "message"];
}

message ItemStack {
  int64 id = 1;
  int32 config_id = 2;
  int64 count = 3;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_ACCEPTED = 1;
  TASK_STATUS_FINISHED = 2;
  TASK_STATUS_COMMITTED = 3;
}

message TaskState {
  int32 id = 1;
  int64 progress = 2;
  int64 target = 3;
  TaskStatus status = 4;
}

message ItemListReq {}
message ItemListRes {
  int32 code = 1;
  string message = 2;
  repeated ItemStack items = 3;
}
message UseItemReq {
  int64 id = 1;
  int64 count = 2;
}
message DeleteItemReq {
  int64 id = 1;
  int64 count = 2;
}
// Asset mutations return a complete snapshot, including removed stacks and task changes.
message ItemChangeRes {
  int32 code = 1;
  string message = 2;
  Player player = 3;
}
message TaskListReq {}
message TaskListRes {
  int32 code = 1;
  string message = 2;
  repeated TaskState tasks = 3;
}
message CommitTaskReq { int32 id = 1; }
message CommitTaskRes {
  int32 code = 1;
  string message = 2;
  Player player = 3;
}
